<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; background: #07090E; color: white; margin: 0; }
    h2 { color: #22d3ee; margin-top: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    p { color: #94a3b8; font-size: 12px; line-height: 1.4; margin-bottom: 14px;}
    button { background: #06b6d4; color: black; border: none; padding: 11px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s; margin-bottom: 8px; }
    button:hover { background: #22d3ee; }
    .btn-tiktok { background: #f43f5e; color: white; }
    .btn-tiktok:hover { background: #e11d48; }
    .status-badge { font-size: 10px; font-family: monospace; padding: 3px 8px; border-radius: 99px; background: rgba(34, 211, 238, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); display: inline-block; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h2>⚡ JARVIS & GhostMarket</h2>
  <span class="status-badge">AUTO-PILOT CONECTADO</span>
  
  <p>Controle autônomo do TikTok, geração de vídeos em código e monitoramento em tempo real.</p>
  
  <button id="postTikTokBtn" class="btn-tiktok">🎬 Auto-Postar Vídeo no TikTok</button>
  <button id="openJarvisBtn">🤖 Abrir Painel JARVIS (/jarvis)</button>
  
  <script src="popup.js"></script>
</body>
</html>
